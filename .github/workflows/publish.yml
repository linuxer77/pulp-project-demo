name: Build and Publish Debian Package

on:
  push:
    tags:
      - 'v*.*.*' # Triggers ONLY when you push a tag like v1.0.3
  workflow_dispatch: # Keeps the manual button for testing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        # If tag is v1.0.3, this extracts just '1.0.3' and saves it to an environment variable
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "VERSION=1.0.2" >> $GITHUB_ENV # Fallback for manual workflow_dispatch runs
          fi

      - name: Inject Version into DEBIAN/control
        run: |
          # Dynamically overwrite the Version field in the control file
          sed -i "s/^Version:.*/Version: ${{ env.VERSION }}/" package/DEBIAN/control
          echo "Updated control file:"
          cat package/DEBIAN/control

      - name: Build the .deb package
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pulp CLI
        run: pip install pulp-cli pulp-cli-deb

      - name: Configure Pulp CLI
        run: pulp config create --base-url ${{ secrets.PULP_BASE_URL }} --username ${{ secrets.PULP_USERNAME }} --password ${{ secrets.PULP_PASSWORD }}

      - name: Upload and Publish to Pulp
        run: |
          echo "Uploading package version ${{ env.VERSION }} to Pulp..."
          pulp deb content upload --repository asama-debian --file hello-asama_${{ env.VERSION }}_amd64.deb

          echo "Generating new signed publication..."
          pulp deb publication create --repository asama-debian --signing-service asama-deb-signer

          echo "Successfully published! APT clients will receive this update on their next 'apt update'."
